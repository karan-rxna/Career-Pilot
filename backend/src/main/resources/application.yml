spring:
  application:
    name: careerpilot-api

  datasource:
    # Neon gives a postgresql:// URL — convert to jdbc:postgresql:// and keep ?sslmode=require
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/careerpilot}
    username: ${DATABASE_USER:careerpilot}
    password: ${DATABASE_PASSWORD:careerpilot}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only verifies it matches the entities.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

careerpilot:
  jwt:
    # must be a URL: Spring's Jwt#getIssuer() parses 'iss' as a URI (RFC 7519)
    issuer: ${JWT_ISSUER:https://careerpilot.app}
    # HS256 needs >= 32 bytes. Always override in production.
    secret: ${JWT_SECRET:dev-only-secret-change-me-32-bytes-minimum}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
  auth:
    cookie-secure: ${COOKIE_SECURE:false}
    reset-token-ttl: PT1H
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
